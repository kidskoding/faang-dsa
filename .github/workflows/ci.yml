name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync development environment
        run: uv sync --group dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install mdBook CLI
        run: cargo install mdbook --locked

      - name: Check Python style
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Check Markdown formatting
        run: find . -path './.git' -prune -o -path './.venv' -prune -o -path './.pytest_cache' -prune -o -path './book' -prune -o -path './book-src' -prune -o -name '*.md' -type f -print | xargs -r uv run mdformat --check

      - name: Build docs site
        run: |
          uv run python scripts/sync_mdbook.py
          mdbook build
