[project]
name = "faang-dsa"
version = "0.1.0"
description = "dsa prep in Python for internship, co-op, and new-grad interviews at big tech companies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pytest>=9.0.3",
]

[dependency-groups]
dev = [
    "mdformat>=0.7.22",
    "mdformat-frontmatter>=2.0.8",
    "mdformat-gfm>=0.4.1",
    "ruff>=0.11.13",
    "ty>=0.0.1a1",
]

[tool.mdformat]
wrap = 88

[tool.pytest.ini_options]
pythonpath = [
    "redos/2026-08-25",
    "redos/2026-08-24",
    "01_arrays_and_hashing",
    "02_two_pointers",
    "03_stacks_and_queues",
    "04_sliding_window",
    "05_binary_search",
    "06_linked_lists",
    "07_trees",
    "08_heaps",
    "09_backtracking",
    "10_graphs",
    "11_dp",
    "12_greedy_algorithms",
    "13_intervals",
    "14_tries",
    "15_bit_manipulation",
    "16_math_geometry",
    "17_advanced",
    "18_mixed_interview_practice",
    "other/mock_interviews/astranis",
    "redos/2026-08-23",
]
testpaths = [
    "01_arrays_and_hashing",
    "02_two_pointers",
    "03_stacks_and_queues",
    "04_sliding_window",
    "05_binary_search",
    "06_linked_lists",
    "07_trees",
    "08_heaps",
    "09_backtracking",
    "10_graphs",
    "11_dp",
    "12_greedy_algorithms",
    "13_intervals",
    "14_tries",
    "15_bit_manipulation",
    "16_math_geometry",
    "17_advanced",
    "18_mixed_interview_practice",
    "other/mock_interviews",
    "redos"
]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ty.environment]
extra-paths = [
    "01_arrays_and_hashing",
    "02_two_pointers",
    "03_stacks_and_queues",
    "04_sliding_window",
    "05_binary_search",
    "06_linked_lists",
    "07_trees",
    "08_heaps",
    "09_backtracking",
    "10_graphs",
    "11_dp",
    "12_greedy_algorithms",
    "13_intervals",
    "14_tries",
    "15_bit_manipulation",
    "16_math_geometry",
    "17_advanced",
    "18_mixed_interview_practice",
    "other/mock_interviews/astranis",
]

[tool.ty.rules]
# Every unsolved problem is a stub whose body is `raise NotImplementedError`,
# so the declared return type is never actually produced.
empty-body = "ignore"

[[tool.ty.overrides]]
# problem_set/ is a workspace: 800 stubs that get solved, rewritten, and
# re-solved. Gating CI on half-finished practice code would turn the build red
# every evening, so these are checked by running ty locally, not by CI.
include = ["**/problem_set/**"]

[tool.ty.overrides.rules]
no-matching-overload = "ignore"

[[tool.ty.overrides]]
# Tests build a known-good structure then walk it, so node.next.next is safe
# even though the annotation says the link is optional. Asserting the shape
# first would only pad the test.
include = ["**/tests/**"]

[tool.ty.overrides.rules]
unresolved-attribute = "ignore"
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
invalid-assignment = "ignore"
